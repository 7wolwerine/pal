<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PAL · medvěd AR</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 22px; z-index: 10;
    text-align: center; pointer-events: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: #fff; font-size: 13px; letter-spacing: .3px;
  }
  .hint span {
    background: rgba(20,10,24,.72); padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255,120,170,.5);
  }
</style>
</head>
<body>
<div class="hint"><span id="hint">Namiř foťák na značku s medvědem 🐻</span></div>

<script>
/* Kam vede ťuknutí na medvěda. Stránka leží ve složce ar/ vedle hry, takže hra je o složku výš. */
const GAME_URL = '../';

/* Obal všech sítí objektu v souřadnicích jiného objektu (rámce). */
function boxIn(frame, object) {
  frame.updateWorldMatrix(true, false);
  object.updateWorldMatrix(true, true);
  const toFrame = new THREE.Matrix4().copy(frame.matrixWorld).invert();
  const m = new THREE.Matrix4(), corner = new THREE.Vector3(), box = new THREE.Box3();
  object.traverse((o) => {
    if (!o.isMesh) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox;
    m.multiplyMatrices(toFrame, o.matrixWorld);
    for (let i = 0; i < 8; i++) {
      corner.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).applyMatrix4(m);
      box.expandByPoint(corner);
    }
  });
  return box;
}

/* ---- lesklá konfetová srdíčka ----
   Padají kolem medvěda (ne na něj), třepotají se, dopadnou na zem, chvíli tam
   leží a pak se zmenší a zmizí. Lesk dělá kovový materiál, ve kterém se zrcadlí
   malé nakreslené „studio“ se světly, a lehce vypouklý povrch, po kterém
   odlesky při otáčení přejíždějí. Všechna se kreslí najednou jako jedna síť. */
AFRAME.registerComponent('hearts', {
  schema: {
    count:  { type: 'int',    default: 130 },
    area:   { type: 'number', default: 2.6 },   /* průměr kruhu, do kterého padají */
    top:    { type: 'number', default: 2.2 },   /* odkud padají */
    size:   { type: 'number', default: 0.09 },
    speed:  { type: 'number', default: 0.7 },
    rest:   { type: 'number', default: 3.5 },   /* kolik sekund leží, než zmizí */
    around: { type: 'selector' },               /* model, kterému se vyhýbají */
    margin: { type: 'number', default: 0.1 }    /* odstup od modelu */
  },
  init: function () {
    const d = this.data;
    const colors = ['#ff3d7f','#ff8fb3','#ffc93c','#3cc8ff','#a06bff','#3fe0a8','#ff7a45','#ff5ad1'];
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff, metalness: 1, roughness: 0.1, side: THREE.DoubleSide,
      envMap: this._studio(), envMapIntensity: 1.7
    });
    if (!material.envMap) { material.metalness = 0.3; material.roughness = 0.25; }
    this.mesh = new THREE.InstancedMesh(this._heart(d.size), material, d.count);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    const color = new THREE.Color();
    for (let i = 0; i < d.count; i++) {
      this.mesh.setColorAt(i, color.set(colors[i % colors.length]).convertSRGBToLinear());
    }
    this.el.object3D.add(this.mesh);

    /* Půdorys modelu, do kterého srdíčka nepadají. Než se model načte, platí odhad. */
    this.hole = { x: 0, z: 0, rx: 0.45, rz: 0.45 };
    this.items = [];
    for (let i = 0; i < d.count; i++) {
      const h = { pos: new THREE.Vector3(), q: new THREE.Quaternion(), restQ: new THREE.Quaternion(), axis: new THREE.Vector3(), scale: 1 };
      this._drop(h, true);
      this.items.push(h);
    }
    this.turn = new THREE.Quaternion(); this.matrix = new THREE.Matrix4(); this.scaleV = new THREE.Vector3();
    if (d.around) {
      d.around.addEventListener('model-loaded', () => this._measure());
      this._measure();
    }
  },
  _measure: function () {
    const target = this.data.around.getObject3D('mesh');
    if (!target) return;
    const box = boxIn(this.el.object3D, target);
    if (box.isEmpty()) return;
    this.hole = {
      x: (box.min.x + box.max.x) / 2, z: (box.min.z + box.max.z) / 2,
      rx: (box.max.x - box.min.x) / 2, rz: (box.max.z - box.min.z) / 2
    };
    for (const h of this.items) this._drop(h, true);
  },
  /* Vybere místo dopadu v prstenci kolem modelu a pustí srdíčko shora. */
  _drop: function (h, spread) {
    const d = this.data, hole = this.hole;
    const angle = Math.random() * Math.PI * 2, cos = Math.cos(angle), sin = Math.sin(angle);
    const edge = 1 / Math.hypot(cos / (hole.rx + d.margin), sin / (hole.rz + d.margin));
    const reach = Math.max(edge + 0.3, d.area / 2);
    const r = edge + (reach - edge) * Math.pow(Math.random(), 1.5);   /* hustěji u medvěda */
    h.x = hole.x + cos * r; h.z = hole.z + sin * r;
    /* Každé leží jinak vysoko a lehce nakloněné, aby se nepřekrývala a leskla se různě. */
    h.landY = 0.012 + Math.random() * 0.02;
    h.restQ.setFromEuler(new THREE.Euler(
      -Math.PI / 2 + (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, Math.random() * Math.PI * 2, 'YXZ'));
    h.y = spread ? h.landY + Math.random() * (d.top - h.landY) : d.top + Math.random() * 0.8;
    h.vy = d.speed * (0.7 + Math.random() * 0.6);
    h.amp = 0.02 + Math.random() * 0.05; h.freq = 0.8 + Math.random() * 1.6; h.ph = Math.random() * Math.PI * 2;
    h.axis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    h.spin = 2 + Math.random() * 4;
    h.q.setFromAxisAngle(h.axis, Math.random() * Math.PI * 2);
    h.resting = false; h.timer = 0; h.scale = 1;
  },
  tick: function (time, dt) {
    const s = dt / 1000; if (!s || s > 0.1) return;
    const t = time / 1000, d = this.data;
    this.items.forEach((h, i) => {
      if (!h.resting) {
        h.y -= h.vy * s;
        const sway = Math.sin(t * h.freq + h.ph) * h.amp * THREE.MathUtils.clamp((h.y - h.landY) / 0.4, 0, 1);
        h.pos.set(h.x + sway, Math.max(h.y, h.landY), h.z + sway * 0.6);
        h.q.multiply(this.turn.setFromAxisAngle(h.axis, h.spin * s));
        if (h.y <= h.landY) { h.resting = true; h.timer = d.rest * (0.7 + Math.random() * 0.6); }
      } else {
        h.pos.set(h.x, h.landY, h.z);
        h.q.slerp(h.restQ, Math.min(1, s * 10));
        h.timer -= s;
        if (h.timer < 0) {
          h.scale = 1 + h.timer / 0.6;   /* poslední půlvteřinu se zmenšuje */
          if (h.scale <= 0) this._drop(h, false);
        }
      }
      this.mesh.setMatrixAt(i, this.matrix.compose(h.pos, h.q, this.scaleV.setScalar(Math.max(h.scale, 0.0001))));
    });
    this.mesh.instanceMatrix.needsUpdate = true;
  },
  /* Srdce podle klasické křivky: dva oblé laloky a špička. Plocha je rovná,
     ale kolmice jsou u okraje vykloněné ven, takže se leskne jako vypouklé. */
  _heart: function (size) {
    const N = 48, outline = [];
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      outline.push([
        16 * Math.pow(Math.sin(t), 3),
        13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5
      ]);
    }
    outline.reverse();   /* proti směru hodin, aby přední strana mířila k +Z */
    const k = size / 32, rings = [[0.55, 0.38], [1, 1.05]];   /* [podíl poloměru, náklon kolmice v radiánech] */
    const position = [0, 0, 0], normal = [0, 0, 1], index = [];
    for (const [share, tilt] of rings) {
      for (let i = 0; i < N; i++) {
        const [x, y] = outline[i], a = outline[(i + N - 1) % N], b = outline[(i + 1) % N];
        let nx = b[1] - a[1], ny = -(b[0] - a[0]);
        const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
        if (nx * x + ny * y < 0) { nx = -nx; ny = -ny; }
        position.push(x * share * k, y * share * k, 0);
        normal.push(nx * Math.sin(tilt), ny * Math.sin(tilt), Math.cos(tilt));
      }
    }
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N, inner = 1, outer = 1 + N;
      index.push(0, inner + i, inner + j);
      index.push(inner + i, outer + i, outer + j, inner + i, outer + j, inner + j);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(position, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(normal, 3));
    g.setIndex(index);
    return g;
  },
  /* Malé „studio“, které se v konfetách zrcadlí: tmavší pozadí a pár jasných
     světel. Čím větší kontrast, tím zřetelnější záblesky. */
  _studio: function () {
    const renderer = this.el.sceneEl.renderer;
    if (!renderer) return null;
    try {
      const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
      const g = cv.getContext('2d');
      const back = g.createLinearGradient(0, 0, 0, 256);
      back.addColorStop(0, '#e9ecff'); back.addColorStop(0.3, '#8f95c4');
      back.addColorStop(0.55, '#6a6796'); back.addColorStop(1, '#3b3158');
      g.fillStyle = back; g.fillRect(0, 0, 512, 256);
      g.fillStyle = '#ffffff';
      for (const [x, y, w, h] of [[30, 34, 86, 44], [186, 58, 44, 66], [300, 28, 96, 36], [440, 64, 40, 60]]) g.fillRect(x, y, w, h);
      g.fillRect(0, 124, 512, 5);                                   /* světlý pruh na obzoru */
      g.fillStyle = '#ffd0e4'; g.fillRect(120, 150, 70, 26); g.fillRect(360, 156, 60, 22);
      const sheet = new THREE.CanvasTexture(cv);
      sheet.mapping = THREE.EquirectangularReflectionMapping; sheet.encoding = THREE.sRGBEncoding;
      const pmrem = new THREE.PMREMGenerator(renderer);
      const env = pmrem.fromEquirectangular(sheet).texture;
      pmrem.dispose(); sheet.dispose();
      return env;
    } catch (e) {
      return null;   /* bez zrcadlení zůstanou srdíčka barevná, jen méně lesklá */
    }
  }
});

/* ---- cedulka nad modelem ----
   Bublina s nápisem a srdíčkem, otočená vždy ke kameře. Když se model načte,
   posadí se kousek nad jeho hlavu. */
AFRAME.registerComponent('sign', {
  schema: {
    text:  { type: 'string', default: 'Klikni na mě' },
    above: { type: 'selector' },
    width: { type: 'number', default: 1.3 },
    gap:   { type: 'number', default: 0.14 },
    y:     { type: 'number', default: 1.3 }    /* výška, dokud se model nenačte */
  },
  init: function () {
    const canvas = this._draw(this.data.text);
    const map = new THREE.CanvasTexture(canvas); map.encoding = THREE.sRGBEncoding;
    this.height = this.data.width * canvas.height / canvas.width;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(this.data.width, this.height),
      new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide, toneMapped: false })
    );
    mesh.renderOrder = 10;   /* cedulka se kreslí poslední a přes všechno, aby ji srdíčka nezakrývala */
    this.el.setObject3D('mesh', mesh);
    this.baseY = this.data.y;
    this.parentQ = new THREE.Quaternion(); this.cameraQ = new THREE.Quaternion();
    if (this.data.above) {
      this.data.above.addEventListener('model-loaded', () => {
        const box = boxIn(this.el.object3D.parent, this.data.above.object3D);
        if (!box.isEmpty()) this.baseY = box.max.y + this.data.gap + this.height / 2;
      });
    }
  },
  tick: function (time) {
    const o = this.el.object3D, camera = this.el.sceneEl.camera;
    o.position.y = this.baseY + Math.sin(time / 700) * 0.04;
    if (!camera || !o.parent) return;
    o.parent.getWorldQuaternion(this.parentQ).invert();
    o.quaternion.copy(this.parentQ.multiply(camera.getWorldQuaternion(this.cameraQ)));
  },
  _draw: function (text) {
    const font = '700 88px "Arial Rounded MT Bold", "Nunito", "Baloo 2", "Trebuchet MS", system-ui, sans-serif';
    const probe = document.createElement('canvas').getContext('2d'); probe.font = font;
    const textW = Math.ceil(probe.measureText(text).width);
    const heart = 84, space = 26, padX = 56, border = 10, tail = 44, bodyH = 176;
    const W = textW + space + heart + padX * 2 + border * 2, H = bodyH + tail + border * 2;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    /* bublina se špičkou dolů */
    const x0 = border, y0 = border, x1 = W - border, y1 = border + bodyH, r = bodyH / 2, cx = W / 2;
    g.beginPath();
    g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.arcTo(x1, y0, x1, y0 + r, r);
    g.arcTo(x1, y1, x1 - r, y1, r);
    g.lineTo(cx + 34, y1); g.lineTo(cx, y1 + tail); g.lineTo(cx - 34, y1);
    g.lineTo(x0 + r, y1); g.arcTo(x0, y1, x0, y1 - r, r); g.arcTo(x0, y0, x0 + r, y0, r);
    g.closePath();
    g.fillStyle = '#fffafc'; g.fill();
    g.lineWidth = border; g.lineJoin = 'round'; g.strokeStyle = '#ff8fb3'; g.stroke();
    /* nápis */
    g.font = font; g.fillStyle = '#4a1e54'; g.textBaseline = 'middle'; g.textAlign = 'left';
    const midY = y0 + bodyH / 2 + 4;
    g.fillText(text, border + padX, midY);
    /* srdíčko místo <3 */
    const hx = border + padX + textW + space + heart / 2, top = midY - heart * 0.42, w = heart * 0.5, h = heart * 0.86;
    g.beginPath();
    g.moveTo(hx, top + h * 0.25);
    g.bezierCurveTo(hx - w, top - h * 0.5, hx - w * 1.1, top + h * 0.6, hx, top + h);
    g.bezierCurveTo(hx + w * 1.1, top + h * 0.6, hx + w, top - h * 0.5, hx, top + h * 0.25);
    g.closePath(); g.fillStyle = '#ff5a8a'; g.fill();
    return cv;
  }
});

/* ---- ťuknutí na model otevře stránku ----
   Paprsek se počítá tady, ne přes A-Frame kurzor: AR.js přepisuje projekci
   kamery napřímo a kurzor pak míří vedle. Cílem je kvádr kolem modelu
   i cedulky, o kousek větší, aby se dal trefit prstem. */
AFRAME.registerComponent('tap-opens', {
  schema: { url: { type: 'string' }, marker: { type: 'selector' }, padding: { type: 'number', default: 0.15 } },
  init: function () {
    const ray = new THREE.Raycaster(), point = new THREE.Vector2();
    const box = new THREE.Box3(), size = new THREE.Vector3();
    this.onTap = (event) => {
      const scene = this.el.sceneEl, marker = this.data.marker;
      if (!scene.canvas || !scene.camera || (marker && !marker.object3D.visible)) return;
      box.setFromObject(this.el.object3D);
      if (box.isEmpty()) return;
      box.expandByVector(box.getSize(size).multiplyScalar(this.data.padding));
      const rect = scene.canvas.getBoundingClientRect();
      point.set(((event.clientX-rect.left)/rect.width)*2-1, -((event.clientY-rect.top)/rect.height)*2+1);
      scene.camera.projectionMatrixInverse.copy(scene.camera.projectionMatrix).invert();
      ray.setFromCamera(point, scene.camera);
      /* Než AR.js značku poprvé umístí, sedí model přímo v kameře a trefil by ho každý dotyk. */
      if (box.containsPoint(ray.ray.origin)) return;
      if (ray.ray.intersectsBox(box)) window.location.href = this.data.url;
    };
    window.addEventListener('click', this.onTap);
  },
  remove: function () { window.removeEventListener('click', this.onTap); }
});

/* ---- nápověda podle toho, jestli je značka vidět ---- */
AFRAME.registerComponent('hint-text', {
  schema: { found: { type: 'string' }, lost: { type: 'string' } },
  init: function () {
    const hint = document.getElementById('hint');
    this.el.addEventListener('markerFound', () => { hint.textContent = this.data.found; });
    this.el.addEventListener('markerLost', () => { hint.textContent = this.data.lost; });
  }
});
</script>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true"
  arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false">

  <a-assets>
    <a-asset-item id="bearModel" src="bear.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
  <a-entity light="type: directional; color: #fff; intensity: 0.9" position="1 3 2"></a-entity>

  <!-- Značka je černý čtverec s medvídkem uprostřed QR kódu; její vzhled popisuje pal-marker.patt. -->
  <a-marker
    id="palMarker"
    type="pattern"
    url="pal-marker.patt"
    emitevents="true"
    smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"
    hint-text="found: Ťukni na medvěda 🐻; lost: Namiř foťák na značku s medvědem 🐻">

    <!-- Jednotkou je šířka černého čtverce, a ten je asi čtvrtina celého kódu.
         Tohle jedno číslo zvětší medvěda, srdíčka i cedulku dohromady. -->
    <a-entity scale="3 3 3">

      <!-- Na co se dá ťuknout: medvěd a cedulka. -->
      <a-entity id="tapTarget" tap-opens="marker: #palMarker">
        <!-- Velikost samotného medvěda je scale (bylo 0.7). -->
        <a-entity
          id="bear"
          gltf-model="#bearModel"
          position="0 0 0"
          rotation="0 0 0"
          scale="1.1 1.1 1.1"
          animation__bob="property: position; dir: alternate; to: 0 0.06 0; loop: true; dur: 1600; easing: easeInOutSine">
        </a-entity>

        <a-entity sign="text: Klikni na mě; above: #bear"></a-entity>
      </a-entity>

      <!-- srdíčka prší kolem něj -->
      <a-entity hearts="around: #bear"></a-entity>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  document.getElementById('tapTarget').setAttribute('tap-opens', 'url', GAME_URL);
</script>
</body>
</html>
