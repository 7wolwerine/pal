<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PAL · medvěd AR</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 22px; z-index: 10;
    text-align: center; pointer-events: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: #fff; font-size: 13px; letter-spacing: .3px;
  }
  .hint span {
    background: rgba(20,10,24,.72); padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255,120,170,.5);
  }
  .motion {
    position: fixed; left: 50%; bottom: 70px; z-index: 11; transform: translateX(-50%);
    font: 600 15px system-ui, sans-serif; color: #fff; cursor: pointer;
    background: #2260cc; border: 0; border-radius: 999px; padding: 12px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  .motion[hidden] { display: none; }
  /* Plocha, do které se scéna při odchodu do hry zhasne. Má barvu a puntíky
     stolu ze hry (src/styles/tokens.css, motiv harmless), takže hra pak na
     stejném pozadí jen vyjede svým oknem. */
  .veil {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background-color: #fbeaf0;
    background-image: radial-gradient(#f4c0d1 1.5px, transparent 1.5px);
    background-size: 22px 22px;
  }
  .veil[hidden] { display: none; }
  body.leaving .hint, body.leaving .motion { display: none; }
</style>
</head>
<body>
<div class="veil" id="veil" hidden></div>
<div class="hint"><span id="hint">Namiř foťák na značku s medvědem 🐻</span></div>
<button class="motion" id="motion" type="button" hidden>Povolit pohyb, ať medvěd stojí rovně</button>

<script>
/* Kam vede druhé ťuknutí na medvěda. Stránka leží ve složce ar/ vedle hry, takže hra je o složku výš. */
const GAME_URL = '../';

/* Obal všech sítí objektu v souřadnicích jiného objektu (rámce). */
function boxIn(frame, object) {
  frame.updateWorldMatrix(true, false);
  object.updateWorldMatrix(true, true);
  const toFrame = new THREE.Matrix4().copy(frame.matrixWorld).invert();
  const m = new THREE.Matrix4(), corner = new THREE.Vector3(), box = new THREE.Box3();
  object.traverse((o) => {
    if (!o.isMesh) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox;
    m.multiplyMatrices(toFrame, o.matrixWorld);
    for (let i = 0; i < 8; i++) {
      corner.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).applyMatrix4(m);
      box.expandByPoint(corner);
    }
  });
  return box;
}

/* ---- plynulé přechody ---- */
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const lerp = (a, b, p) => a + (b - a) * p;
/* Jak daleko je děj, který začíná v čase `from` a trvá `length`: od 0 do 1. */
const progress = (t, from, length) => clamp01((t - from) / length);
const ease = {
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  outBack: (p) => 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2),
  inBack: (p) => 2.7 * p * p * p - 1.7 * p * p,
  inOutBack: (p) => {
    const c = 2.6;
    return p < 0.5 ? (Math.pow(2 * p, 2) * ((c + 1) * 2 * p - c)) / 2
      : (Math.pow(2 * p - 2, 2) * ((c + 1) * (2 * p - 2) + c) + 2) / 2;
  }
};
/* Kdo si vypnul animace, má je aspoň rychlé. */
const PACE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 3 : 1;

/* ---- srdce jako konfeta ----
   Srdce podle klasické křivky: dva oblé laloky a špička. Je ploché a tenké
   jako fóliová konfeta. Kolmice jsou u okraje jen nepatrně vykloněné, jako
   u lehce prohnutého plíšku, aby po něm odlesk při otáčení přejel. */
function heartGeometry(size) {
  const N = 48, outline = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2;
    outline.push([
      16 * Math.pow(Math.sin(t), 3),
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5
    ]);
  }
  outline.reverse();   /* proti směru hodin, aby přední strana mířila k +Z */
  const k = size / 32, bend = 0.1;   /* náklon kolmice na okraji v radiánech */
  const position = [0, 0, 0], normal = [0, 0, 1], index = [];
  for (let i = 0; i < N; i++) {
    const [x, y] = outline[i], len = Math.hypot(x, y) || 1;
    position.push(x * k, y * k, 0);
    normal.push((x / len) * Math.sin(bend), (y / len) * Math.sin(bend), Math.cos(bend));
    index.push(0, 1 + i, 1 + (i + 1) % N);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(position, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normal, 3));
  g.setIndex(index);
  return g;
}

/* Malé „studio“, které se v konfetách zrcadlí: tmavší pozadí a pár jasných
   světel. Čím větší kontrast, tím zřetelnější záblesky. Kreslí se jednou
   a sdílí ho všechna srdíčka. */
let studio;
function studioEnv(renderer) {
  if (studio !== undefined || !renderer) return studio || null;
  studio = null;
  try {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
    const g = cv.getContext('2d');
    const back = g.createLinearGradient(0, 0, 0, 256);
    back.addColorStop(0, '#e9ecff'); back.addColorStop(0.3, '#8f95c4');
    back.addColorStop(0.55, '#6a6796'); back.addColorStop(1, '#3b3158');
    g.fillStyle = back; g.fillRect(0, 0, 512, 256);
    g.fillStyle = '#ffffff';
    for (const [x, y, w, h] of [[30, 34, 86, 44], [186, 58, 44, 66], [300, 28, 96, 36], [440, 64, 40, 60]]) g.fillRect(x, y, w, h);
    g.fillRect(0, 124, 512, 5);                                   /* světlý pruh na obzoru */
    g.fillStyle = '#ffd0e4'; g.fillRect(120, 150, 70, 26); g.fillRect(360, 156, 60, 22);
    const sheet = new THREE.CanvasTexture(cv);
    sheet.mapping = THREE.EquirectangularReflectionMapping; sheet.encoding = THREE.sRGBEncoding;
    const pmrem = new THREE.PMREMGenerator(renderer);
    studio = pmrem.fromEquirectangular(sheet).texture;
    pmrem.dispose(); sheet.dispose();
  } catch (e) {
    studio = null;   /* bez zrcadlení zůstanou srdíčka barevná, jen méně lesklá */
  }
  return studio;
}

function foilMaterial(renderer, colour) {
  const env = studioEnv(renderer);
  return new THREE.MeshStandardMaterial({
    color: colour, side: THREE.DoubleSide, envMapIntensity: 1.7, envMap: env,
    metalness: env ? 1 : 0.3, roughness: env ? 0.1 : 0.25
  });
}

/* ---- lesklá konfetová srdíčka ----
   Padají kolem medvěda (ne na něj), třepotají se, dopadnou na zem, chvíli tam
   leží a pak se zmenší a zmizí. Lesk dělá kovový materiál, ve kterém se zrcadlí
   malé nakreslené „studio“ se světly: jak se plochá konfeta otáčí, střídavě
   se zablýskne a ztmavne. Všechna se kreslí najednou jako jedna síť. */
AFRAME.registerComponent('hearts', {
  schema: {
    count:  { type: 'int',    default: 130 },
    area:   { type: 'number', default: 2.6 },   /* průměr kruhu, do kterého padají */
    top:    { type: 'number', default: 2.2 },   /* odkud padají */
    size:   { type: 'number', default: 0.09 },
    speed:  { type: 'number', default: 0.7 },
    rest:   { type: 'number', default: 3.5 },   /* kolik sekund leží, než zmizí */
    around: { type: 'selector' },               /* model, kterému se vyhýbají */
    margin: { type: 'number', default: 0.1 }    /* odstup od modelu */
  },
  init: function () {
    const d = this.data;
    const colors = ['#ff3d7f','#ff8fb3','#ffc93c','#3cc8ff','#a06bff','#3fe0a8','#ff7a45','#ff5ad1'];
    const material = foilMaterial(this.el.sceneEl.renderer, 0xffffff);
    this.mesh = new THREE.InstancedMesh(heartGeometry(d.size), material, d.count);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    const color = new THREE.Color();
    for (let i = 0; i < d.count; i++) {
      this.mesh.setColorAt(i, color.set(colors[i % colors.length]).convertSRGBToLinear());
    }
    this.el.object3D.add(this.mesh);

    /* Půdorys modelu, do kterého srdíčka nepadají. Než se model načte, platí odhad. */
    this.hole = { x: 0, z: 0, rx: 0.45, rz: 0.45 };
    this.items = [];
    for (let i = 0; i < d.count; i++) {
      const h = { pos: new THREE.Vector3(), q: new THREE.Quaternion(), restQ: new THREE.Quaternion(), axis: new THREE.Vector3(), scale: 1 };
      this._drop(h, true);
      this.items.push(h);
    }
    this.turn = new THREE.Quaternion(); this.matrix = new THREE.Matrix4(); this.scaleV = new THREE.Vector3();
    if (d.around) {
      d.around.addEventListener('model-loaded', () => this._measure());
      this._measure();
    }
  },
  _measure: function () {
    const target = this.data.around.getObject3D('mesh');
    if (!target) return;
    const box = boxIn(this.el.object3D, target);
    if (box.isEmpty()) return;
    this.hole = {
      x: (box.min.x + box.max.x) / 2, z: (box.min.z + box.max.z) / 2,
      rx: (box.max.x - box.min.x) / 2, rz: (box.max.z - box.min.z) / 2
    };
    for (const h of this.items) this._drop(h, true);
  },
  /* Vybere místo dopadu v prstenci kolem modelu a pustí srdíčko shora. */
  _drop: function (h, spread) {
    const d = this.data, hole = this.hole;
    const angle = Math.random() * Math.PI * 2, cos = Math.cos(angle), sin = Math.sin(angle);
    const edge = 1 / Math.hypot(cos / (hole.rx + d.margin), sin / (hole.rz + d.margin));
    const reach = Math.max(edge + 0.3, d.area / 2);
    const r = edge + (reach - edge) * Math.pow(Math.random(), 1.5);   /* hustěji u medvěda */
    h.x = hole.x + cos * r; h.z = hole.z + sin * r;
    /* Každé leží jinak vysoko a lehce nakloněné, aby se nepřekrývala a leskla se různě. */
    h.landY = 0.012 + Math.random() * 0.02;
    h.restQ.setFromEuler(new THREE.Euler(
      -Math.PI / 2 + (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, Math.random() * Math.PI * 2, 'YXZ'));
    h.y = spread ? h.landY + Math.random() * (d.top - h.landY) : d.top + Math.random() * 0.8;
    h.vy = d.speed * (0.7 + Math.random() * 0.6);
    h.amp = 0.02 + Math.random() * 0.05; h.freq = 0.8 + Math.random() * 1.6; h.ph = Math.random() * Math.PI * 2;
    h.axis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    h.spin = 2 + Math.random() * 4;
    h.q.setFromAxisAngle(h.axis, Math.random() * Math.PI * 2);
    h.resting = false; h.timer = 0; h.scale = 1;
  },
  tick: function (time, dt) {
    const s = dt / 1000; if (!s || s > 0.1) return;
    const t = time / 1000, d = this.data;
    this.items.forEach((h, i) => {
      if (!h.resting) {
        h.y -= h.vy * s;
        const sway = Math.sin(t * h.freq + h.ph) * h.amp * THREE.MathUtils.clamp((h.y - h.landY) / 0.4, 0, 1);
        h.pos.set(h.x + sway, Math.max(h.y, h.landY), h.z + sway * 0.6);
        h.q.multiply(this.turn.setFromAxisAngle(h.axis, h.spin * s));
        if (h.y <= h.landY) { h.resting = true; h.timer = d.rest * (0.7 + Math.random() * 0.6); }
      } else {
        h.pos.set(h.x, h.landY, h.z);
        h.q.slerp(h.restQ, Math.min(1, s * 10));
        h.timer -= s;
        if (h.timer < 0) {
          h.scale = 1 + h.timer / 0.6;   /* poslední půlvteřinu se zmenšuje */
          if (h.scale <= 0) this._drop(h, false);
        }
      }
      this.mesh.setMatrixAt(i, this.matrix.compose(h.pos, h.q, this.scaleV.setScalar(Math.max(h.scale, 0.0001))));
    });
    this.mesh.instanceMatrix.needsUpdate = true;
  }
});

/* ---- cedulka nad modelem ----
   Bublina otočená vždy ke kameře. Když se model načte, posadí se kousek nad
   jeho hlavu. Napřed říká „Klikni“ a vedle ní se třpytí srdíčko stejné jako
   konfety. Po ťuknutí se „Klikni“ smaže, napíše se 3107, otočí se vzhůru
   nohama na LOVE a připíše se YOU. Další ťuknutí všechno zhasne jako starou
   televizi: nápis se slisuje do čárky, čárka do tečky a z tečky se rozroste
   stůl ze hry, na kterém hra vyjede svým oknem. */

/* Časy v milisekundách od ťuknutí. */
const LOVE = {
  eraseStep: 45, eraseLength: 120,     /* „Klikni“ mizí od konce, písmeno po písmenu */
  typeAt: 380, typeStep: 110, popLength: 180,
  turnAt: 900, turnLength: 750,        /* 3107 se převrátí na LOVE */
  youAt: 1750,
  readyAt: 2150,                       /* odtud další ťuknutí vede do hry */
  caretEnd: 3000
};
const OFF = {
  flicker: 160,
  squashAt: 140, squashLength: 160,    /* slisuje se do vodorovné čárky */
  shrinkAt: 300, shrinkLength: 140,    /* čárka se stáhne do tečky */
  fadeAt: 440, fadeLength: 90,
  othersLength: 380,                   /* medvěd a srdíčka se zatím schovají */
  veilAt: 400, veilLength: 560         /* z tečky se rozroste stůl ze hry */
};
const SIGN = {
  font: '800 92px ui-rounded, "Arial Rounded MT Bold", "Nunito", "Baloo 2", "Trebuchet MS", system-ui, sans-serif',
  ink: '#4a1e54', love: '#e8336f', paper: '#fffafc', line: '#ff8fb3',
  heart: 100, space: 30, padX: 58, border: 10, tail: 44, bodyH: 176
};

/* Barva mezi dvěma #rrggbb. */
function mix(a, b, p) {
  const at = (hex, i) => parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16);
  return 'rgb(' + [0, 1, 2].map((i) => Math.round(lerp(at(a, i), at(b, i), p))).join(',') + ')';
}

/* Zhasne stránku do stolu ze hry a hru otevře. */
function leaveTo(url, x, y, length) {
  document.body.classList.add('leaving');
  const veil = document.getElementById('veil');
  veil.hidden = false;
  const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 4;
  const iris = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('clip-path', 'circle(1px at 0 0)');
  if (veil.animate) {
    veil.animate(iris
      ? [{ clipPath: `circle(3px at ${x}px ${y}px)` }, { clipPath: `circle(${r}px at ${x}px ${y}px)` }]
      : [{ opacity: 0 }, { opacity: 1 }],
      { duration: length, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'forwards' });
  }
  setTimeout(() => { window.location.href = url; }, length + 60);
}
/* Po návratu zpět z hry ukáže prohlížeč stránku tak, jak ji opustil. */
window.addEventListener('pageshow', (event) => {
  if (!event.persisted) return;
  const veil = document.getElementById('veil');
  if (veil.getAnimations) veil.getAnimations().forEach((a) => a.cancel());
  veil.hidden = true;
  document.body.classList.remove('leaving');
});

AFRAME.registerComponent('sign', {
  schema: {
    above:  { type: 'selector' },
    others: { type: 'selectorAll' },               /* co se při odchodu schová spolu s cedulkou */
    url:    { type: 'string' },
    pixel:  { type: 'number', default: 0.00165 },  /* velikost jednoho bodu obrázku ve scéně */
    gap:    { type: 'number', default: 0.14 },
    y:      { type: 'number', default: 1.3 }       /* výška, dokud se model nenačte */
  },
  init: function () {
    const probe = document.createElement('canvas').getContext('2d'); probe.font = SIGN.font;
    const width = (text) => probe.measureText(text).width;
    this.widthOf = width;
    this.wordSpace = width(' ') * 1.1;
    this.capHeight = probe.measureText('K3Y').actualBoundingBoxAscent || 66;
    const longest = Math.max(width('Klikni'), width('3107') + this.wordSpace + width('YOU'));
    const W = Math.ceil(longest + 24 + SIGN.space + SIGN.heart + SIGN.padX * 2 + SIGN.border * 2);
    const H = SIGN.bodyH + SIGN.tail + SIGN.border * 2;
    this.canvas = document.createElement('canvas'); this.canvas.width = W; this.canvas.height = H;
    this.ctx = this.canvas.getContext('2d');
    this.map = new THREE.CanvasTexture(this.canvas); this.map.encoding = THREE.sRGBEncoding;
    this.height = H * this.data.pixel;
    this.mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(W * this.data.pixel, this.height),
      new THREE.MeshBasicMaterial({ map: this.map, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide, toneMapped: false })
    );
    this.mesh.renderOrder = 10;   /* cedulka se kreslí poslední a přes všechno, aby ji srdíčka nezakrývala */
    this.el.setObject3D('mesh', this.mesh);

    /* srdíčko jako konfeta, třpytí se, jak se natáčí */
    const foil = foilMaterial(this.el.sceneEl.renderer, new THREE.Color('#ff3d7f').convertSRGBToLinear());
    /* průhledné jen naoko: three.js kreslí neprůhledné věci dřív a cedulka by srdíčko překryla */
    foil.transparent = true; foil.depthTest = false; foil.depthWrite = false;
    this.heart = new THREE.Mesh(heartGeometry(SIGN.heart * this.data.pixel), foil);
    this.heart.renderOrder = 11;
    this.mesh.add(this.heart);

    this.baseY = this.data.y;
    this.parentQ = new THREE.Quaternion(); this.cameraQ = new THREE.Quaternion();
    if (this.data.above) {
      this.data.above.addEventListener('model-loaded', () => {
        const box = boxIn(this.el.object3D.parent, this.data.above.object3D);
        if (!box.isEmpty()) this.baseY = box.max.y + this.data.gap + this.height / 2;
      });
    }
    this.el.parentEl.addEventListener('tap', () => this._tap());
    window.addEventListener('pageshow', (event) => { if (event.persisted) this._reset(); });
    this._reset();
  },

  _tap: function () {
    const now = performance.now();
    if (this.mode === 'ask') {
      this.mode = 'love'; this.since = now; this.popAt = now; this.still = false;
    } else if (this.mode === 'love' && (now - this.since) * PACE >= LOVE.readyAt) {
      this.mode = 'off'; this.since = now; this.veiled = false;
      this.scales = this.data.others.map((el) => el.object3D.scale.clone());
      const motion = document.getElementById('motion'); if (motion) motion.hidden = true;
    }
  },

  _reset: function () {
    if (this.scales) this.data.others.forEach((el, i) => el.object3D.scale.copy(this.scales[i]));
    this.mode = 'ask'; this.still = true; this.popAt = -1e9; this.since = 0;
    this.mesh.scale.set(1, 1, 1);
    this.mesh.material.color.setScalar(1); this.mesh.material.opacity = 1;
    this.heart.visible = true;
    this._render(this._ask(), 1);
  },

  /* Co je na cedulce: písmena za sebou, každé s tím, nakolik už je vidět. */
  _ask: function () {
    return { glyphs: [...'Klikni'].map((ch) => ({ ch, shown: 1, scale: 1 })), turn: 0, caret: 0 };
  },
  _love: function (t) {
    const L = LOVE, glyphs = [];
    const ask = [...'Klikni'];
    ask.forEach((ch, i) => {
      const p = progress(t, (ask.length - 1 - i) * L.eraseStep, L.eraseLength);
      if (p < 1) glyphs.push({ ch, shown: 1 - p, scale: 1 - 0.5 * p });
    });
    const type = (text, at, group) => [...text].forEach((ch, i) => {
      const p = progress(t, at + i * L.typeStep, L.popLength);
      if (p > 0) glyphs.push({ ch, shown: ease.outCubic(p), scale: 0.4 + 0.6 * ease.outBack(p), group });
    });
    type('3107', L.typeAt, 'love');
    if (t >= L.youAt - 60) glyphs.push({ ch: ' ', space: true, shown: 1, scale: 1 });
    type('YOU', L.youAt, 'you');
    const turnP = progress(t, L.turnAt, L.turnLength);
    let caret = 0;
    if (t < L.turnAt) caret = 1;
    else if (t >= L.turnAt + L.turnLength && t < L.readyAt) caret = 1;
    else if (t >= L.readyAt && t < L.caretEnd) caret = Math.floor((t - L.readyAt) / 220) % 2 ? 0 : 1;
    return { glyphs, turn: ease.inOutBack(turnP), bump: Math.sin(Math.PI * turnP), tint: ease.outCubic(turnP), caret };
  },

  /* Nakreslí bublinu a nápis a posadí srdíčko za poslední písmeno. */
  _render: function (pose, alpha) {
    const g = this.ctx, W = this.canvas.width, H = this.canvas.height, S = SIGN;
    g.clearRect(0, 0, W, H);
    g.globalAlpha = alpha;
    let x = 0;
    for (const glyph of pose.glyphs) {
      glyph.w = glyph.space ? this.wordSpace : this.widthOf(glyph.ch);
      glyph.x = x; x += glyph.w * glyph.shown;
    }
    const content = x, gap = S.space * Math.min(1, content / 40);
    const bw = content + gap + S.heart + S.padX * 2;
    const x0 = (W - bw) / 2, x1 = x0 + bw, y0 = S.border, y1 = S.border + S.bodyH, r = S.bodyH / 2, cx = W / 2;
    g.beginPath();
    g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.arcTo(x1, y0, x1, y0 + r, r);
    g.arcTo(x1, y1, x1 - r, y1, r);
    g.lineTo(cx + 34, y1); g.lineTo(cx, y1 + S.tail); g.lineTo(cx - 34, y1);
    g.lineTo(x0 + r, y1); g.arcTo(x0, y1, x0, y1 - r, r); g.arcTo(x0, y0, x0 + r, y0, r);
    g.closePath();
    g.fillStyle = S.paper; g.fill();
    g.lineWidth = S.border; g.lineJoin = 'round'; g.strokeStyle = S.line; g.stroke();

    const left = x0 + S.padX, midY = y0 + S.bodyH / 2, baseline = midY + this.capHeight / 2;
    g.font = S.font; g.textBaseline = 'alphabetic'; g.textAlign = 'center';
    const draw = (glyph, colour) => {
      if (glyph.space || glyph.shown <= 0) return;
      g.save();
      g.globalAlpha = alpha * Math.min(1, glyph.shown * 1.5);
      g.translate(left + glyph.x + (glyph.w * glyph.shown) / 2, midY);
      g.scale(glyph.scale, glyph.scale);
      g.fillStyle = colour;
      g.fillText(glyph.ch, 0, baseline - midY);
      g.restore();
    };
    /* 3107 se točí jako celek kolem svého středu, takže vzhůru nohama čte LOVE */
    const love = pose.glyphs.filter((glyph) => glyph.group === 'love');
    if (love.length) {
      const last = love[love.length - 1];
      const centre = left + (love[0].x + last.x + last.w * last.shown) / 2;
      /* napříč by se do bubliny nevešlo, proto se v půli otočky zmenší */
      const s = 1 - 0.42 * (pose.bump || 0);
      g.save();
      g.translate(centre, midY); g.rotate(Math.PI * pose.turn); g.scale(s, s); g.translate(-centre, -midY);
      const tinted = mix(S.ink, S.love, pose.tint || 0);
      love.forEach((glyph) => draw(glyph, tinted));
      g.restore();
    }
    pose.glyphs.filter((glyph) => glyph.group !== 'love').forEach((glyph) => draw(glyph, S.ink));
    if (pose.caret > 0) {
      g.globalAlpha = alpha * pose.caret; g.fillStyle = S.ink;
      g.fillRect(left + content + 5, midY - this.capHeight / 2 - 10, 7, this.capHeight + 20);
    }
    g.globalAlpha = 1;
    this.map.needsUpdate = true;
    const hx = left + content + gap + S.heart / 2;
    this.heart.position.set((hx - W / 2) * this.data.pixel, (H / 2 - midY) * this.data.pixel, 0.005);
  },

  /* Kde na displeji je střed cedulky; tam se slisuje do tečky. */
  _onScreen: function () {
    const scene = this.el.sceneEl, rect = scene.canvas.getBoundingClientRect();
    const v = new THREE.Vector3().setFromMatrixPosition(this.mesh.matrixWorld).project(scene.camera);
    const x = rect.left + ((v.x + 1) / 2) * rect.width, y = rect.top + ((1 - v.y) / 2) * rect.height;
    if (!isFinite(x) || !isFinite(y) || v.z > 1) return [innerWidth / 2, innerHeight / 2];
    return [Math.min(innerWidth, Math.max(0, x)), Math.min(innerHeight, Math.max(0, y))];
  },

  _switchOff: function (t) {
    const O = OFF, m = this.mesh;
    if (t < O.flicker + 32) {
      const flicker = [1, 0.3, 1, 0.15, 0.9][Math.floor(t / 32)];
      this._render(this._love(Infinity), flicker === undefined ? 1 : flicker);
    }
    const squash = ease.inCubic(progress(t, O.squashAt, O.squashLength));
    const shrink = ease.inCubic(progress(t, O.shrinkAt, O.shrinkLength));
    m.scale.set(lerp(lerp(1, 1.08, squash), 0.012, shrink), lerp(1, 0.035, squash), 1);
    m.material.color.setScalar(1 + 1.6 * squash);   /* rozsvítí se do bíla jako obrazovka, která zhasíná */
    m.material.opacity = 1 - progress(t, O.fadeAt, O.fadeLength);
    this.heart.visible = shrink <= 0;
    const k = Math.max(0.0001, 1 - ease.inBack(progress(t, 0, O.othersLength)));
    this.data.others.forEach((el, i) => el.object3D.scale.copy(this.scales[i]).multiplyScalar(k));
    if (!this.veiled && t >= O.veilAt) {
      this.veiled = true;
      const [x, y] = this._onScreen();
      leaveTo(this.data.url, x, y, O.veilLength / PACE);
    }
  },

  tick: function (time) {
    const o = this.el.object3D, camera = this.el.sceneEl.camera, now = performance.now();
    o.position.y = this.baseY + Math.sin(time / 700) * 0.04;
    const t = (now - this.since) * PACE;
    if (this.mode === 'love' && !this.still) {
      if (t > LOVE.caretEnd) { this._render(this._love(Infinity), 1); this.still = true; }
      else this._render(this._love(t), 1);
    } else if (this.mode === 'off') this._switchOff(t);
    /* srdíčko se kolébá jako padající konfeta; po ťuknutí poskočí a po dopsání se celé otočí */
    const pop = Math.sin(Math.PI * progress((now - this.popAt) * PACE, 0, 260));
    const spin = this.mode === 'love' ? Math.PI * 2 * ease.outCubic(progress(t, LOVE.readyAt - 100, 700)) : 0;
    this.heart.rotation.set(0, Math.sin(now / 620) * 0.75 + spin, Math.sin(now / 900) * 0.12);
    this.heart.scale.setScalar(1 + 0.2 * pop);
    if (!camera || !o.parent) return;
    o.parent.getWorldQuaternion(this.parentQ).invert();
    o.quaternion.copy(this.parentQ.multiply(camera.getWorldQuaternion(this.cameraQ)));
  }
});

/* ---- ťuknutí na model nebo cedulku ----
   Paprsek se počítá tady, ne přes A-Frame kurzor: AR.js přepisuje projekci
   kamery napřímo a kurzor pak míří vedle. Cílem jsou kvádry kolem modelu
   a kolem cedulky, o kousek větší, aby se daly trefit prstem. Zásah pošle
   událost `tap`; co se pak stane, řeší cedulka. */
AFRAME.registerComponent('tap-target', {
  schema: { marker: { type: 'selector' }, padding: { type: 'number', default: 0.15 } },
  init: function () {
    const ray = new THREE.Raycaster(), point = new THREE.Vector2();
    const box = new THREE.Box3(), size = new THREE.Vector3();
    this.onTap = (event) => {
      const scene = this.el.sceneEl, marker = this.data.marker;
      if (!scene.canvas || !scene.camera || (marker && !marker.object3D.visible)) return;
      /* Ťuknutí na tlačítko (třeba povolení pohybu) není ťuknutí na medvěda. */
      if (event.target && event.target.closest && event.target.closest('button, .a-modal')) return;
      const rect = scene.canvas.getBoundingClientRect();
      point.set(((event.clientX-rect.left)/rect.width)*2-1, -((event.clientY-rect.top)/rect.height)*2+1);
      scene.camera.projectionMatrixInverse.copy(scene.camera.projectionMatrix).invert();
      ray.setFromCamera(point, scene.camera);
      /* Každá část má vlastní kvádr; jeden společný by kvůli široké cedulce
         a hlubokému medvědovi zabral skoro celý obraz. */
      for (const part of this.el.object3D.children) {
        box.setFromObject(part);
        if (box.isEmpty()) continue;
        box.expandByVector(box.getSize(size).multiplyScalar(this.data.padding));
        /* Než AR.js značku poprvé umístí, sedí model přímo v kameře a trefil by ho každý dotyk. */
        if (box.containsPoint(ray.ray.origin)) continue;
        if (ray.ray.intersectsBox(box)) { this.el.emit('tap', null, false); return; }
      }
    };
    window.addEventListener('click', this.onTap);
  },
  remove: function () { window.removeEventListener('click', this.onTap); }
});

/* ---- scéna stojí rovně, i když značka visí na svislé obrazovce ----
   Značka sama neříká, kde je dole: karta na stole a karta na monitoru vypadají
   při pohledu zpříma stejně. Řekne to až senzor náklonu v telefonu. Scéna se
   podle něj natočí tak, aby její osa Y mířila vzhůru. Dokud senzor mlčí
   (počítač, nepovolený přístup na iPhonu), stojí medvěd kolmo na značku. */
AFRAME.registerComponent('upright', {
  schema: {
    ease: { type: 'number', default: 8 },   /* jak rychle se dorovnává */
    drop: { type: 'number', default: 0.5 }  /* o kolik šířek značky sjede dolů na svislé značce; půlka je spodní okraj rámu */
  },
  init: function () {
    this.up = null;   /* směr vzhůru v souřadnicích obrazu kamery; null, dokud senzor mlčí */
    this.settled = false;
    this.axis = new THREE.Vector3(0, 1, 0); this.v = new THREE.Vector3();
    this.target = new THREE.Quaternion(); this.frame = new THREE.Quaternion();
    this.onTilt = (event) => {
      if (typeof event.beta !== 'number' || typeof event.gamma !== 'number') return;
      const rad = Math.PI / 180, b = event.beta * rad, g = event.gamma * rad;
      /* vzhůru v souřadnicích telefonu: x doprava, y k hornímu okraji, z z displeje ven */
      const x = -Math.cos(b) * Math.sin(g), y = Math.sin(b), z = Math.cos(b) * Math.cos(g);
      /* obraz kamery se otáčí s displejem, telefon naležato má osy pootočené */
      const turned = typeof window.orientation === 'number' ? window.orientation
        : (screen.orientation && screen.orientation.angle) || 0;
      const c = Math.cos(turned * rad), s = Math.sin(turned * rad);
      if (!this.up) this.up = new THREE.Vector3();
      this.up.set(x * c - y * s, x * s + y * c, z);
    };
    window.addEventListener('deviceorientation', this.onTilt);
  },
  tick: function (time, dt) {
    const o = this.el.object3D, camera = this.el.sceneEl.camera;
    if (!this.up || !camera || !o.parent || !o.parent.visible) { this.settled = false; return; }
    /* směr vzhůru převedený z kamery do souřadnic značky */
    this.v.copy(this.up).applyQuaternion(camera.getWorldQuaternion(this.frame));
    this.v.applyQuaternion(o.parent.getWorldQuaternion(this.frame).invert()).normalize();
    this.target.setFromUnitVectors(this.axis, this.v);
    /* Po nalezení značky se scéna postaví hned, potom se dorovnává plynule. */
    if (this.settled) o.quaternion.slerp(this.target, Math.min(1, (dt / 1000) * this.data.ease));
    else { o.quaternion.copy(this.target); this.settled = true; }
    /* Čím svisleji značka visí, tím níž po ní scéna sjede, až medvěd sedí
       u spodního okraje kódu a nad ním zbude místo na hlavu a cedulku. */
    this.v.copy(this.axis).applyQuaternion(o.quaternion);
    o.position.set(-this.v.x * this.data.drop, 0, -this.v.z * this.data.drop);
  },
  remove: function () { window.removeEventListener('deviceorientation', this.onTilt); }
});

/* ---- povolení senzoru pohybu na iPhonu ----
   iPhone pustí údaje o náklonu až po souhlasu a o ten se dá požádat jen
   z ťuknutí. Tlačítko se proto ukáže, až když kamera najde modrý kód pro
   obrazovku: u vytištěného kódu senzor není potřeba a nikdo se nemusí nic
   povolovat. Android údaje posílá bez ptaní, tam se tlačítko neukáže. */
AFRAME.registerComponent('motion-permission', {
  schema: { button: { type: 'selector' } },
  init: function () {
    const ask = typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission;
    const button = this.data.button;
    if (!ask || !button) return;
    let settled = false;
    /* Když údaje už chodí (povoleno dřív, nebo prohlížeč se neptá), tlačítko není potřeba. */
    const flowing = (event) => {
      if (typeof event.beta !== 'number') return;
      settled = true; button.hidden = true;
      window.removeEventListener('deviceorientation', flowing);
    };
    window.addEventListener('deviceorientation', flowing);
    this.el.addEventListener('markerFound', () => { if (!settled) button.hidden = false; });
    button.addEventListener('click', () => {
      settled = true; button.hidden = true;
      DeviceOrientationEvent.requestPermission().catch(() => 'denied');
    });
  }
});

/* ---- nápověda podle toho, jestli je značka vidět ---- */
AFRAME.registerComponent('hint-text', {
  schema: { found: { type: 'string' }, lost: { type: 'string' } },
  init: function () {
    const hint = document.getElementById('hint');
    this.el.addEventListener('markerFound', () => { hint.textContent = this.data.found; });
    this.el.addEventListener('markerLost', () => { hint.textContent = this.data.lost; });
  }
});
</script>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true"
  arjs="sourceType: webcam; detectionMode: mono; patternRatio: 0.75; debugUIEnabled: false">

  <a-assets>
    <a-asset-item id="bearModel" src="bear.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
  <a-entity light="type: directional; color: #fff; intensity: 0.9" position="1 3 2"></a-entity>

  <!-- Dva kódy, oba tmavý rám a v něm QR kód s hlavou medvěda. AR.js hledá rám a vnitřek
       porovnává se soubory .patt; každý nalezený rám dá tomu, který sedí líp. Vnitřek zabírá
       tři čtvrtiny šířky rámu, a to musí sedět s patternRatio nahoře. Kódy vyrábí
       tools/make-framed-marker.ts. -->

  <!-- Růžový kód k vytištění. Karta leží nebo stojí kdekoli, medvěd stojí kolmo na ni. -->
  <a-marker
    id="printMarker"
    type="pattern"
    url="pal-marker.patt"
    emitevents="true"
    smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2"
    hint-text="found: Ťukni na medvěda 🐻; lost: Namiř foťák na značku s medvědem 🐻">

    <!-- Jednotkou je šířka tmavého rámu, tedy skoro celý kód.
         Tohle jedno číslo zvětší medvěda, srdíčka i cedulku dohromady. -->
    <a-entity scale="0.85 0.85 0.85">

      <!-- Na co se dá ťuknout: medvěd a cedulka. První ťuknutí přepíše cedulku na LOVE YOU, druhé otevře hru. -->
      <a-entity tap-target="marker: #printMarker">
        <!-- Velikost samotného medvěda je scale. Posun v position ho usazuje
             středem na střed značky: model sám je v souboru kousek mimo střed. -->
        <a-entity
          id="printBear"
          gltf-model="#bearModel"
          position="0.02 0 0.09"
          scale="1.1 1.1 1.1"
          animation__bob="property: position; dir: alternate; to: 0.02 0.06 0.09; loop: true; dur: 1600; easing: easeInOutSine">
        </a-entity>
        <a-entity sign="above: #printBear; others: #printBear, #printHearts"></a-entity>
      </a-entity>

      <!-- srdíčka prší kolem něj -->
      <a-entity id="printHearts" hearts="around: #printBear"></a-entity>
    </a-entity>
  </a-marker>

  <!-- Modrý kód na obrazovku. Ta obvykle stojí svisle, proto se medvěd rovná podle
       senzoru náklonu v telefonu a sjede ke spodnímu okraji kódu. -->
  <a-marker
    id="screenMarker"
    type="pattern"
    url="pal-marker-screen.patt"
    emitevents="true"
    smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2"
    motion-permission="button: #motion"
    hint-text="found: Ťukni na medvěda 🐻; lost: Namiř foťák na značku s medvědem 🐻">

    <a-entity scale="0.85 0.85 0.85" upright>
      <a-entity tap-target="marker: #screenMarker">
        <a-entity
          id="screenBear"
          gltf-model="#bearModel"
          position="0.02 0 0.09"
          scale="1.1 1.1 1.1"
          animation__bob="property: position; dir: alternate; to: 0.02 0.06 0.09; loop: true; dur: 1600; easing: easeInOutSine">
        </a-entity>
        <a-entity sign="above: #screenBear; others: #screenBear, #screenHearts"></a-entity>
      </a-entity>
      <a-entity id="screenHearts" hearts="around: #screenBear"></a-entity>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  for (const sign of document.querySelectorAll('[sign]')) sign.setAttribute('sign', 'url', GAME_URL);
</script>
</body>
</html>
